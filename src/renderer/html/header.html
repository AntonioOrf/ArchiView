    <!--
      ZONA 1 (sinistra) = NAVIGAZIONE: solo i tab della sidebar.
      ZONA 2 (destra)   = STATO GLOBALE: indicatori e sincronizzazione cloud.
      Le azioni sui dati vivono nell'header della vista (Zona 3, viewList.ts).
      Vedi UI_UX_TODO.md — "Legge delle Zone".
    -->
    <header class="panel-glass shrink-0 mb-6 flex items-center justify-between gap-3 p-2">

        <!-- ZONA 1 — Navigazione pannelli sidebar -->
        <nav id="sidebar-tablist" role="tablist" aria-orientation="horizontal" class="flex items-center gap-0.5 shrink-0" data-i18n-aria-label="nav_panels" aria-label="Pannelli">
            <button id="btn-tab-folders" role="tab" aria-selected="false" aria-controls="sidebar-folders" tabindex="0" onclick="switchSidebarTab('folders')" class="btn btn-ghost btn-icon" data-tab="folders" data-i18n-title="tooltip_folders" data-i18n-aria-label="tooltip_folders">
                <i data-lucide="folder" class="w-5 h-5"></i>
            </button>

            <button id="btn-tab-search" role="tab" aria-selected="false" aria-controls="sidebar-search" tabindex="-1" onclick="switchSidebarTab('search')" class="btn btn-ghost btn-icon" data-tab="search" data-shortcut="Ctrl+F" data-i18n-title="tooltip_search_btn" data-i18n-aria-label="tooltip_search_btn">
                <i data-lucide="search" class="w-5 h-5"></i>
            </button>

            <button id="btn-tab-tags" role="tab" aria-selected="false" aria-controls="sidebar-tags" tabindex="-1" onclick="switchSidebarTab('tags')" class="btn btn-ghost btn-icon" data-tab="tags" data-i18n-title="tooltip_tags_btn" data-i18n-aria-label="tooltip_tags_btn">
                <i data-lucide="bookmark" class="w-5 h-5"></i>
            </button>

            <button id="btn-tab-source-control" role="tab" aria-selected="false" aria-controls="sidebar-source-control" tabindex="-1" onclick="switchSidebarTab('source-control')" class="btn btn-ghost btn-icon" data-tab="source-control" data-i18n-title="tooltip_source_control" data-i18n-aria-label="tooltip_source_control">
                <i data-lucide="git-pull-request" class="w-5 h-5"></i>
            </button>

            <button id="btn-tab-history" role="tab" aria-selected="false" aria-controls="sidebar-history" tabindex="-1" onclick="switchSidebarTab('history')" class="btn btn-ghost btn-icon" data-tab="history" data-i18n-title="tooltip_history" data-i18n-aria-label="tooltip_history">
                <i data-lucide="history" class="w-5 h-5"></i>
            </button>
        </nav>

        <!-- ZONA 2 — Stato globale (sincronizzazione) -->
        <div class="flex items-center justify-end gap-2 min-w-0">

            <!-- ZONA 2 — Un solo controllo cloud (Fase 3.1/3.4). Stato prevalente in una riga;
                 il dettaglio sta nel popover, non in indicatori paralleli.
                 Nessun md: qui — il controllo non sparisce a finestra stretta (3.3). -->
            <button id="cloud-status-btn" type="button" onclick="apriPopoverCloud(this)" aria-haspopup="menu" aria-expanded="false"
                    class="btn btn-ghost flex items-center gap-2 min-w-0 max-w-[240px] border border-stone-300 dark:border-stone-600">
                <i id="cloud-status-icon" data-lucide="cloud" class="w-4 h-4 shrink-0"></i>
                <span id="cloud-status-label" class="text-xs font-medium truncate"></span>
                <!-- Il chevron è l'unico segnale che qui si apre qualcosa: senza, il
                     controllo si legge come un'etichetta di stato e le azioni di sync
                     restano non scoperte. -->
                <i data-lucide="chevron-down" class="w-3.5 h-3.5 shrink-0 opacity-60"></i>
            </button>

            <!-- L'azione che lo stato corrente richiede, sempre visibile e con etichetta:
                 Ricevi se ci sono aggiornamenti, Invia se ci sono modifiche locali,
                 Controlla se è tutto allineato. Le altre due restano nel popover. -->
            <button id="cloud-primary-action" type="button" style="display:none" class="btn btn-secondary items-center gap-1.5 shrink-0">
                <i id="cloud-primary-action-icon" data-lucide="refresh-cw" class="w-4 h-4 shrink-0"></i>
                <span id="cloud-primary-action-label" class="text-xs font-medium"></span>
            </button>
        </div>
    </header>
