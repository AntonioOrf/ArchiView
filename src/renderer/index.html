<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchiView</title>
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('theme') || 'system';
                const isDark = savedTheme === 'dark' || (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (isDark) document.documentElement.classList.add('dark-theme');
            } catch (e) {}
        })();
    </script>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://js.pusher.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: local-asset: https://*.googleusercontent.com https://*.ggpht.com; frame-src 'self' local-asset: https://docs.google.com https://apis.google.com; connect-src 'self' https://api.github.com http: https: ws: wss:;">
    <link rel="stylesheet" href="css/tailwind.css">
    <script src="vendor/lucide.min.js"></script>
    <script src="vendor/purify.min.js"></script>
    <link rel="stylesheet" href="vendor/driver.css">
    <script src="vendor/driver.js.iife.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen p-4 md:p-6 flex flex-col h-screen overflow-hidden">



    <!-- @include 'html/header.html' -->
    <!-- @include 'html/toasts-bars.html' -->

    <div class="flex-1 flex flex-col md:flex-row gap-6 overflow-hidden">
        <!-- @include 'html/sidebar.html' -->
        <main class="flex-1 panel-glass p-6 h-full overflow-y-auto custom-scroll">
        </main>
    </div>

    <!-- FONDAMENTA, prima di ogni altro script dell'app. Gli script defer girano in ordine
         di documento: con i18n in coda esisteva una finestra — breve a cache calda, lunga
         al primo avvio dopo un aggiornamento — in cui la welcome modal era gia' visibile e
         cliccabile ma window.t non c'era ancora, e creaCartellaIniziale() moriva con
         "t is not a function" facendo fallire in silenzio la creazione dell'archivio.
         Le due vanno insieme e in quest'ordine: i modali chiamano applicaTraduzioniHtml()
         gia' in fase di init, e quella usa sia window.t (i18n) sia window.sanitizeHTML
         (utils). Spostare solo i18n rompe i modali invece di sistemarli. -->
    <!-- Fase 3.0 — Schema, versione e migrazioni del dato. PRIMO fra gli script dell'app:
         `state.js` migra il database appena letto e `itemsLogic.js` crea le schede da qui,
         quindi `window.Model` deve esistere prima di tutti. Il file è copiato da
         out/shared/ da scripts/copy-shared.js. -->
    <script defer src="js/shared/model.js"></script>
    <!-- Fase 3.2 — parser della data storica. Dopo il modello (ne condivide le convenzioni)
         e prima di utils/mainView, che lo usano per ordinare e filtrare. -->
    <script defer src="js/shared/dataStorica.js"></script>
    <!-- Fase 2.4 — analisi del CSV e costruzione delle schede da importare. Usa il modello
         (tipi dei campi, `creaScheda`) e lo cerca al momento della chiamata, non al
         caricamento: l'ordine con model.js conta comunque, ed è questo. -->
    <script defer src="js/shared/csvImport.js"></script>
    <script defer src="js/logic/i18n.js"></script>
    <script defer src="js/logic/utils.js"></script>

    <!-- Nuovi componenti Modali -->
    <script defer src="js/components/modals/welcomeModal.js"></script>
    <script defer src="js/components/modals/imagePdfModal.js"></script>
    <script defer src="js/components/modals/folderModal.js"></script>
    <script defer src="js/components/modals/newTypeModal.js"></script>
    <script defer src="js/components/modals/manageTypesModal.js"></script>
    <script defer src="js/components/modals/campoProprioModal.js"></script>
    <script defer src="js/components/modals/deleteModal.js"></script>
    <script defer src="js/components/modals/unsavedModal.js"></script>
    <script defer src="js/components/modals/renameModal.js"></script>
    <script defer src="js/components/modals/docsModal.js"></script>
    <script defer src="js/components/modals/settingsModal.js"></script>
    <script defer src="js/components/modals/mergeConflictModal.js"></script>
    <script defer src="js/components/modals/deletionConflictModal.js"></script>
    <script defer src="js/components/modals/cloudModal.js"></script>
    <script defer src="js/components/modals/shareModal.js"></script>
    <!-- Generato in build da RELEASE_NOTES.md (scripts/build-changelog.js): deve precedere
         changelogModal, che ne legge window.changelogData. -->
    <script defer src="js/changelogContent.js"></script>
    <script defer src="js/components/modals/changelogModal.js"></script>
    <script defer src="js/components/modals/diffModal.js"></script>
    
    <!-- Nuovi componenti Viste e Banners -->
    <!-- Visualizzatore immagini (Fase 1.2): usato sia dal modal allegati sia dal pannello
         della trascrizione, quindi caricato prima di entrambi. -->
    <script defer src="js/components/imageViewer.js"></script>
    <script defer src="js/components/banners.js"></script>
    <script defer src="js/components/views/viewList.js"></script>
    <script defer src="js/components/views/viewAdd.js"></script>
    <script defer src="js/components/views/viewTrascrizione.js"></script>
    <script defer src="js/components/tutorial.js"></script>

    <!-- Script Application (i18n.js è caricato prima dei componenti, vedi sopra) -->
    <script defer src="js/state.js"></script>
    <script defer src="js/store.js"></script>
    <!-- Logic (utils.js e' gia' caricato insieme a i18n.js fra le fondamenta) -->
    <script defer src="js/logic/foldersLogic.js"></script>
    <script defer src="js/logic/itemsLogic.js"></script>
    <script defer src="js/logic/attachmentsLogic.js"></script>
    <script defer src="js/logic/typesLogic.js"></script>
    <script defer src="js/logic/campiPropriLogic.js"></script>
    <script defer src="js/logic/riordinoCampiLogic.js"></script>
    <script defer src="js/logic/settingsLogic.js"></script>
    <script defer src="js/logic/diffMergeLogic.js"></script>
    <script defer src="js/logic/hubLogic.js"></script>
    <script defer src="js/logic/driveLogic.js"></script>
    <script defer src="js/logic/realtimeLogic.js"></script>
    <!-- Tag come entità (Fase 3.4): operazioni d'archivio su rinomina, fusione, colore.
         Dopo store.js, di cui usa `commit()`, e prima di sidebar/mainView, che ne usano
         `classeColoreTag` per disegnare i chip. -->
    <script defer src="js/logic/tagsLogic.js"></script>
    <!-- Vocabolari controllati (3.3), relazioni e anagrafica (3.5), duplicati (3.6).
         Dopo store.js, di cui usa `commit()`, e prima dei pannelli che ne chiamano le
         operazioni. -->
    <script defer src="js/logic/vocabolariLogic.js"></script>

    <!-- Cestino (Fase 4.1): le mutazioni. Dopo store.js, di cui usa `commit()`. Chi
         elimina (itemsLogic, foldersLogic, app) chiama `cestinaRecord` solo in risposta a
         un click, quindi l'ordine con quei file non conta. -->
    <script defer src="js/logic/cestinoLogic.js"></script>

    <script defer src="js/components/contextMenu.js"></script>
    <!-- Filtri avanzati e ricerche salvate (Fase 1.3): i predicati stanno in
         logic/utils.js, qui c'e' solo il pannello. -->
    <script defer src="js/components/filtersPanel.js"></script>
    <!-- Command palette e pannello delle scorciatoie (Fase 1.4): dopo contextMenu e
         filtersPanel, di cui riusa i comandi, e prima di mainView/app, che non la
         invocano al caricamento ma solo in risposta a un tasto. -->
    <script defer src="js/components/commandPalette.js"></script>
    <!-- Azioni in massa (Fase 1.5): dopo la palette, che ne elenca i comandi, e prima di
         app.js, che aggancia le scorciatoie e le voci di menu. -->
    <script defer src="js/components/bulkActions.js"></script>
    <!-- Pannello "Gestione tag" (Fase 3.4): dopo logic/tagsLogic.js, che contiene le
         mutazioni, e prima di app.js per la voce di menu e la chiusura con Esc. -->
    <script defer src="js/components/tagManager.js"></script>
    <!-- Pannelli "Vocabolari"/"Segnature ripetute" (3.3/3.6) e "Persone e luoghi" (3.5):
         dopo logic/vocabolariLogic.js, che contiene le mutazioni, e prima di app.js per le
         voci di menu e la chiusura con Esc. -->
    <script defer src="js/components/vocabolariPanel.js"></script>
    <script defer src="js/components/authorityPanel.js"></script>
    <!-- Vista a grafo dei collegamenti (3.5): usa `relazioniRisolte` di vocabolariLogic e
         `grafoRelazioni` del modello, entrambi solo al click. -->
    <script defer src="js/components/grafoPanel.js"></script>
    <!-- OCR degli allegati (Fase 2.3). Prima di mainView.js, che ne usa `testoOcrRecord`
         per indicizzare il testo riconosciuto, e prima di app.js per le voci di menu. -->
    <script defer src="js/components/ocrPanel.js"></script>
    <!-- Stampa e PDF (Fase 2.2): usa `colonneTabellaCorrenti` e `getManoscrittiFiltrati`
         di mainView solo al click, mai al caricamento, quindi l'ordine con quello non
         conta; conta invece stare prima di app.js, che aggancia Ctrl+P e le voci di menu. -->
    <script defer src="js/components/printPanel.js"></script>
    <!-- Export testuali (Fasi 2.5 e 2.6): DOPO printPanel, da cui prende `ambitiSelezione`
         e le intestazioni (fondo, autore, data), e prima di app.js per le voci di menu. -->
    <script defer src="js/components/exportPanel.js"></script>
    <script defer src="js/components/cloudStatus.js"></script>
    <script defer src="js/components/toasts.js"></script>
    <script defer src="js/components/modals.js"></script>
    <script defer src="js/components/form.js"></script>
    <script defer src="js/components/mainView.js"></script>
    <script defer src="js/components/sidebar.js"></script>
    <!-- Wizard di import CSV (Fase 2.4): l'analisi sta in js/shared/csvImport.js, qui c'è
         solo il modale. Prima di app.js per la voce di menu e la chiusura con Esc. -->
    <script defer src="js/components/importPanel.js"></script>
    <!-- Pannello "Cestino" (Fase 4.1): dopo logic/cestinoLogic.js, che contiene le
         mutazioni, e prima di app.js per la voce di menu e la chiusura con Esc. -->
    <script defer src="js/components/cestinoPanel.js"></script>
    <script defer src="js/components/history.js"></script>
    <script defer src="js/components/issueModal.js"></script>
    <script defer src="js/logic/a11yModal.js"></script>
    <script defer src="js/app.js"></script>
</body>
</html>
