<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>ArchiView — host PDF per OCR</title>
</head>
<body>
<script type="module">
import * as pdfjs from './pdf.min.mjs';

pdfjs.GlobalWorkerOptions.workerSrc = 'ocr-host://app/file/pdf.worker.min.mjs';

let documento = null;

window.__pdfApri = async function (nomeFile) {
  try {
    if (documento) { try { await documento.destroy(); } catch {} documento = null; }
    const compito = pdfjs.getDocument({
      url: 'ocr-host://app/allegato/' + encodeURIComponent(nomeFile),
      isEvalSupported: false,
      enableXfa: false
    });
    documento = await compito.promise;
    return { ok: true, pagine: documento.numPages };
  } catch (errore) {
    return { ok: false, errore: String(errore && errore.message ? errore.message : errore) };
  }
};

window.__pdfTesto = async function (numero) {
  try {
    if (!documento) return { ok: false, errore: 'nessun documento' };
    const pagina = await documento.getPage(numero);
    const contenuto = await pagina.getTextContent();
    const righe = [];
    let yCorrente = null;
    let corrente = [];
    for (const it of contenuto.items) {
      if (typeof it.str !== 'string') continue;
      const y = it.transform ? Math.round(it.transform[5]) : 0;
      if (yCorrente === null || Math.abs(y - yCorrente) <= 2) {
        corrente.push(it.str);
      } else {
        righe.push(corrente.join(''));
        corrente = [it.str];
      }
      yCorrente = y;
    }
    if (corrente.length) righe.push(corrente.join(''));
    pagina.cleanup();
    return { ok: true, righe: righe.map(r => r.trim()) };
  } catch (errore) {
    return { ok: false, errore: String(errore && errore.message ? errore.message : errore) };
  }
};

window.__pdfImmagine = async function (numero, dpi, extra) {
  try {
    if (!documento) return { ok: false, errore: 'nessun documento' };
    const pagina = await documento.getPage(numero);
    const scala = (dpi || 300) / 72;
    const viewport = pagina.getViewport({ scale: scala, rotation: (pagina.rotate + (Number(extra) || 0)) % 360 });
    const canvas = document.createElement('canvas');
    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);
    const ctx = canvas.getContext('2d', { willReadFrequently: false });
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await pagina.render({ canvasContext: ctx, viewport, background: '#ffffff' }).promise;
    const dataUrl = canvas.toDataURL('image/png');
    pagina.cleanup();
    canvas.width = 0;
    canvas.height = 0;
    return { ok: true, png: dataUrl.slice(dataUrl.indexOf(',') + 1), larghezza: viewport.width, altezza: viewport.height };
  } catch (errore) {
    return { ok: false, errore: String(errore && errore.message ? errore.message : errore) };
  }
};

window.__immagineRuotata = async function (nomeFile, gradi) {
  try {
    const risposta = await fetch('ocr-host://app/allegato/' + encodeURIComponent(nomeFile));
    if (!risposta.ok) throw new Error('HTTP ' + risposta.status);
    const bmp = await createImageBitmap(await risposta.blob(), { imageOrientation: 'from-image' });
    const verticale = gradi === 90 || gradi === 270;
    const canvas = document.createElement('canvas');
    canvas.width = verticale ? bmp.height : bmp.width;
    canvas.height = verticale ? bmp.width : bmp.height;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(gradi * Math.PI / 180);
    ctx.drawImage(bmp, -bmp.width / 2, -bmp.height / 2);
    bmp.close();
    const dataUrl = canvas.toDataURL('image/png');
    canvas.width = 0;
    canvas.height = 0;
    return { ok: true, png: dataUrl.slice(dataUrl.indexOf(',') + 1) };
  } catch (errore) {
    return { ok: false, errore: String(errore && errore.message ? errore.message : errore) };
  }
};

window.__pdfChiudi = async function () {
  if (documento) { try { await documento.destroy(); } catch {} documento = null; }
  return { ok: true };
};

window.__pdfPronto = true;
</script>
</body>
</html>
