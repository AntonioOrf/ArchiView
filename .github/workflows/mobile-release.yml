name: ArchiScanner — release APK

# Tag `scanner-vX.Y.Z` (stessa versione di mobile/app.json): APK costruito su EAS e allegato a
# una release GitHub PRERELEASE e mai "latest". L'updater del desktop legge la release
# "latest" del repository: se diventasse questa, proporrebbe l'APK come aggiornamento.
# release.yml ascolta solo `v*`, quindi questi tag non costruiscono l'installer Windows.
#
# Una tantum (vedi mobile/README.md): `npx eas-cli@latest init` in mobile/ (projectId in
# app.json) e il segreto EXPO_TOKEN nel repository.
on:
  push:
    tags: ["scanner-v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout del codice
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Il tag coincide con la versione dell'app
        run: |
          VERSIONE=$(node -p "require('./app.json').expo.version")
          if [ "scanner-v$VERSIONE" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME, ma app.json dice $VERSIONE" >&2
            exit 1
          fi

      - name: Installa le dipendenze
        run: npm ci

      - name: Typecheck e test
        run: npm run typecheck && npm test

      - name: Build APK su EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli@latest build -p android --profile apk --non-interactive --wait --json > build.json
          URL=$(node -p "require('./build.json')[0].artifacts.buildUrl")
          curl -fsSL "$URL" -o "ArchiView-Scanner-${GITHUB_REF_NAME#scanner-v}.apk"

      - name: Release GitHub (prerelease, mai latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ArchiView-Scanner-*.apk \
            --prerelease --latest=false \
            --title "ArchiScanner ${GITHUB_REF_NAME#scanner-v}" \
            --notes "App Android companion di ArchiView. APK da installare a mano (consentire le app da origini sconosciute)."
