name: E2E Tests

on:
  # L'app Android (mobile/) ha il suo workflow: una modifica solo lì non tocca il desktop.
  pull_request:
    paths-ignore: ["mobile/**"]
  push:
    branches: [main]
    paths-ignore: ["mobile/**"]

jobs:
  # Audit delle sole dipendenze che finiscono nell'installer (npm audit legge il lockfile,
  # non serve installare). Quelle di sviluppo (lingui, shx, electron-builder) restano fuori:
  # i loro advisory aperti non hanno correzioni senza downgrade e non girano sulla macchina utente.
  security-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: npm audit (produzione)
        run: npm run security-check

  e2e:
    runs-on: windows-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # 24, non 22: package-lock.json e' generato da npm 11 (node 24), che pota le
          # dipendenze del sottoalbero opzionale @tailwindcss/oxide-wasm32-wasi. L'npm 10
          # di node 22 valida quell'albero alla lettera e "npm ci" muore in 4s con
          # "Missing: @emnapi/core ... from lock file". Se qui si torna a 22, il lockfile
          # va rigenerato con npm 10 — ma il primo "npm install" locale lo riporterebbe
          # com'e' ora. Tenere allineato al npm di sviluppo e' l'unica versione stabile.
          node-version: 24
          cache: "npm"

      - name: Installa le dipendenze
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # I test E2E sono offline: nessun segreto reale, solo uno stub con i nomi esportati
      # richiesti a import-time (hubIpc, hubAttachments) per evitare MODULE_NOT_FOUND.
      - name: Stub cloudCredentials.ts
        shell: bash
        run: |
          cat <<'EOF' > src/main/ipc/cloudCredentials.ts
          export const GOOGLE_CLIENT_ID = "";
          export const GOOGLE_CLIENT_SECRET = "";
          export const GOOGLE_API_KEY = "";
          export const PUSHER_KEY = "";
          export const PUSHER_CLUSTER = "";
          export const HUB_URL = "";
          export const HUB_CREATE_SECRET = "";
          EOF

      - name: Build (CSS + TS)
        run: |
          npm run build-css
          npm run build-ts

      - name: Esegui i test E2E
        run: npx playwright test
        env:
          CI: "true"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Carica report in caso di fallimento
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
