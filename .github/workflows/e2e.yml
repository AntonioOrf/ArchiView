name: E2E Tests

on:
  pull_request:
    paths-ignore: ["mobile/**"]
  push:
    branches: [main]
    paths-ignore: ["mobile/**"]

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: npm audit (produzione)
        run: npm run security-check

  e2e:
    runs-on: windows-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: "npm"

      - name: Installa le dipendenze
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Stub cloudCredentials.ts
        shell: bash
        run: |
          cat <<'EOF' > src/main/ipc/cloudCredentials.ts
          export const GOOGLE_CLIENT_ID = "";
          export const GOOGLE_CLIENT_SECRET = "";
          export const GOOGLE_API_KEY = "";
          export const PUSHER_KEY = "";
          export const PUSHER_CLUSTER = "";
          export const HUB_URL = "";
          export const HUB_CREATE_SECRET = "";
          EOF

      - name: Build (CSS + TS)
        run: |
          npm run build-css
          npm run build-ts

      - name: Esegui i test E2E
        run: npx playwright test
        env:
          CI: "true"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Carica report in caso di fallimento
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
