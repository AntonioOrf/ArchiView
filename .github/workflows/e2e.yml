name: E2E Tests

on:
  pull_request:
    paths-ignore: ["mobile/**"]
  push:
    branches: [main]
    paths-ignore: ["mobile/**"]
  workflow_call:

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: npm audit (produzione)
        run: npm run security-check

  e2e:
    runs-on: windows-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: "npm"

      - name: Installa le dipendenze
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Scarica il binario di Electron
        run: node node_modules/electron/install.js

      - name: Stub cloudCredentials.ts
        shell: bash
        run: |
          cat <<'EOF' > src/main/ipc/cloudCredentials.ts
          export const GOOGLE_CLIENT_ID = "";
          export const GOOGLE_CLIENT_SECRET = "";
          export const GOOGLE_API_KEY = "";
          export const PUSHER_KEY = "";
          export const PUSHER_CLUSTER = "";
          export const HUB_URL = "";
          export const HUB_CREATE_SECRET = "";
          EOF

      - name: Build (CSS + TS)
        run: |
          npm run build-css
          npm run build-ts

      - name: Esegui i test unitari
        run: npm run test:unit

      - name: Esegui i test E2E
        run: npx playwright test
        env:
          CI: "true"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Hub locale (wrangler dev) e test E2E dell'app contro l'Hub
        shell: bash
        working-directory: cloudflare-hub
        env:
          CI: "true"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          avvia() {
            npx wrangler d1 execute archiview-hub --local --persist-to "$RUNNER_TEMP/hub-$1" --file=./src/schema.sql > /dev/null
            npx wrangler dev --local --ip 127.0.0.1 --port "$2" --persist-to "$RUNNER_TEMP/hub-$1" --var CREATE_SECRET:dev-secret "${@:3}" > "$RUNNER_TEMP/hub-$1.log" 2>&1 &
          }
          avvia smoke 8788
          avvia e2e 8789
          avvia app 8790 --var CREATE_MAX_PER_IP_MIN:1000 --var CREATE_MAX_PER_IP_DAY:1000
          for porta in 8788 8789 8790; do
            for i in $(seq 1 90); do curl -s -m 5 -o /dev/null "http://127.0.0.1:$porta/" && break; sleep 1; done
            curl -s -m 5 -o /dev/null "http://127.0.0.1:$porta/" || { cat "$RUNNER_TEMP"/hub-*.log; exit 1; }
          done
          node test/smoke.mjs http://127.0.0.1:8788 dev-secret
          node test/e2e.mjs http://127.0.0.1:8789 dev-secret
          node test/produzione.mjs http://127.0.0.1:8790 dev-secret
          cd ..
          ARCHIVIEW_HUB_LOCALE=http://127.0.0.1:8790 ARCHIVIEW_HUB_SECRET=dev-secret npx playwright test --project=manuali hub-locale

      - name: Carica report in caso di fallimento
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  drive:
    runs-on: windows-latest
    env:
      ARCHIVIEW_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_TEST_REFRESH_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

    steps:
      - name: Token di prova assente
        if: env.ARCHIVIEW_DRIVE_REFRESH_TOKEN == ''
        run: echo "GOOGLE_TEST_REFRESH_TOKEN non impostato, test Drive reali saltati."

      - name: Checkout del codice
        if: env.ARCHIVIEW_DRIVE_REFRESH_TOKEN != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        if: env.ARCHIVIEW_DRIVE_REFRESH_TOKEN != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: "npm"

      - name: Installa le dipendenze
        if: env.ARCHIVIEW_DRIVE_REFRESH_TOKEN != ''
        run: |
          npm ci
          node node_modules/electron/install.js
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: cloudCredentials.ts con il client Google
        if: env.ARCHIVIEW_DRIVE_REFRESH_TOKEN != ''
        shell: bash
        run: |
          {
            echo "export const GOOGLE_CLIENT_ID = \"$GOOGLE_CLIENT_ID\";"
            echo "export const GOOGLE_CLIENT_SECRET = \"$GOOGLE_CLIENT_SECRET\";"
            echo 'export const GOOGLE_API_KEY = "";'
            echo 'export const PUSHER_KEY = "";'
            echo 'export const PUSHER_CLUSTER = "";'
            echo 'export const HUB_URL = "";'
            echo 'export const HUB_CREATE_SECRET = "";'
          } > src/main/ipc/cloudCredentials.ts

      - name: Build (CSS + TS)
        if: env.ARCHIVIEW_DRIVE_REFRESH_TOKEN != ''
        run: |
          npm run build-css
          npm run build-ts

      - name: Test E2E contro Google Drive
        if: env.ARCHIVIEW_DRIVE_REFRESH_TOKEN != ''
        run: npx playwright test drive-reale
        env:
          CI: "true"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Carica report in caso di fallimento
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-drive
          path: |
            playwright-report/
            test-results/
          retention-days: 7
