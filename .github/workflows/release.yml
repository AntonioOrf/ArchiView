name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  release:
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: "npm"

      - name: Installa le dipendenze
        run: npm ci

      - name: Crea file cloudCredentials.ts
        shell: bash
        run: |
          cat <<EOF > src/main/ipc/cloudCredentials.ts
          export const GOOGLE_CLIENT_ID = "${{ secrets.GOOGLE_CLIENT_ID }}";
          export const GOOGLE_CLIENT_SECRET = "${{ secrets.GOOGLE_CLIENT_SECRET }}";
          export const GOOGLE_API_KEY = "${{ secrets.GOOGLE_API_KEY }}";
          export const PUSHER_KEY = "${{ secrets.PUSHER_KEY }}";
          export const PUSHER_CLUSTER = "${{ secrets.PUSHER_CLUSTER }}";
          export const HUB_URL = "${{ secrets.HUB_URL }}";
          export const HUB_CREATE_SECRET = "${{ secrets.HUB_CREATE_SECRET }}";
          EOF

      - name: Smoke dell'Hub di produzione
        if: vars.HUB_SMOKE_PRODUZIONE == '1'
        shell: bash
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_CREATE_SECRET: ${{ secrets.HUB_CREATE_SECRET }}
        run: node cloudflare-hub/test/produzione.mjs "$HUB_URL" "$HUB_CREATE_SECRET"

      - name: Pre-crea la Release come bozza (evita la race di electron-builder)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag gia' esistente: nessuna creazione."
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "${tag#v}" --notes-file RELEASE_NOTES.en.md --verify-tag --draft
          fi

      - name: Costruisci e carica gli artefatti
        run: npm run publish-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pubblica la Release (solo con latest.yml e installer presenti)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          asset=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$asset"
          grep -qx 'latest.yml' <<< "$asset" || { echo "latest.yml mancante: la Release resta bozza."; exit 1; }
          grep -qx "ArchiView-Setup-${tag#v}.exe" <<< "$asset" || { echo "Installer mancante: la Release resta bozza."; exit 1; }
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
