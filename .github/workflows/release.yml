name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Installa le dipendenze
        run: npm install

      - name: Crea file cloudCredentials.ts
        shell: bash
        run: |
          cat <<EOF > src/main/ipc/cloudCredentials.ts
          export const GOOGLE_CLIENT_ID = "${{ secrets.GOOGLE_CLIENT_ID }}";
          export const GOOGLE_CLIENT_SECRET = "${{ secrets.GOOGLE_CLIENT_SECRET }}";
          export const GOOGLE_API_KEY = "${{ secrets.GOOGLE_API_KEY }}";
          export const MS_CLIENT_ID = "${{ secrets.MS_CLIENT_ID }}";
          export const PUSHER_KEY = "${{ secrets.PUSHER_KEY }}";
          export const PUSHER_CLUSTER = "${{ secrets.PUSHER_CLUSTER }}";
          export const PUSHER_WEBHOOK = "${{ secrets.PUSHER_WEBHOOK }}";
          export const HUB_URL = "${{ secrets.HUB_URL }}";
          export const HUB_CREATE_SECRET = "${{ secrets.HUB_CREATE_SECRET }}";
          EOF

      - name: Pre-crea la Release (evita la race di electron-builder)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag gia' esistente: nessuna creazione."
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "${tag#v}" --notes-file RELEASE_NOTES.md --verify-tag
          fi

      - name: Costruisci e pubblica la Release
        run: npm run publish-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
