appId: com.antonioorf.archiview.scanner
name: App in inglese (PIANO-INGLESE-MOBILE) - archivio, scheda, visore, Documenti, cambio di lingua
---
- launchApp
- extendedWaitUntil:
    visible: Fondo Prova, change archive
    timeout: 180000
- assertVisible: "Uploads · 2 batches"
- assertVisible: "Reg\\. 41, 3 pages, On the phone · tap Send now"
- assertVisible: "3 records on the computer.*"
- takeScreenshot: esiti/schermate-en/01-archivio
- tapOn: "Folder Notarile.*"
- tapOn: "Reg\\. 41, Imbreviature.*"
- assertVisible: "To send · 3 pages"
- assertVisible: Number the leaves from
- takeScreenshot: esiti/schermate-en/02-scheda
- tapOn: Open 1r
- assertVisible: "Page 1 of 3 · swipe for the others"
- assertVisible: Rotate
- assertVisible: Crop
- takeScreenshot: esiti/schermate-en/03-visore
- back
- back
- tapOn: Fondo Prova, change archive
- assertVisible: "Archives · they go to the computer"
- tapOn: "Documents, Receipts, articles, photocopies"
- extendedWaitUntil:
    visible: Documents, change archive
    timeout: 15000
- assertVisible: "Only on this phone.*"
- takeScreenshot: esiti/schermate-en/04-documenti
- tapOn: Settings
- assertVisible: Google account
- assertVisible: Sign in with Google
- takeScreenshot: esiti/schermate-en/05-impostazioni
- scrollUntilVisible:
    element: Italiano
- assertVisible:
    text: English
    checked: true
- tapOn: Italiano
- assertVisible: Impostazioni
- assertVisible: Account Google
- scrollUntilVisible:
    element: Lingua
- scrollUntilVisible:
    element: English
- assertVisible:
    text: Italiano
    checked: true
- assertVisible: Abbina col computer
- assertVisible: "Automatica \\(lingua del telefono\\)"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Documenti, cambia archivio
    timeout: 30000
- tapOn: Impostazioni
- scrollUntilVisible:
    element: English
- tapOn: English
- assertVisible: Settings
- assertVisible: Google account
- tapOn: Back
- assertVisible: Documents, change archive
