appId: com.antonioorf.archiview.scanner
name: F11 e F6 - unisci e separa documenti, manda un documento all'archivio
---
- launchApp
- extendedWaitUntil:
    visible: "Ricevuta biblioteca, .*"
    timeout: 180000
- tapOn: "Ricevuta biblioteca, .*"
- tapOn: Unisci un altro documento in fondo
- assertVisible: "In fondo a «Ricevuta biblioteca»"
- tapOn: "Fotocopia articolo, .*"
- assertVisible: Unire i documenti?
- tapOn: "(?i)unisci"
- extendedWaitUntil:
    visible: "Apri la pagina 3"
    timeout: 20000
- tapOn: Apri la pagina 3
- assertVisible: "Pagina 3 di 3 · striscia per le altre"
- tapOn: Separa
- assertVisible: Separare il documento?
- tapOn: "(?i)separa"
- extendedWaitUntil:
    notVisible: "Pagina 3 di 3 · striscia per le altre"
    timeout: 20000
- assertNotVisible: "Apri la pagina 3"
- assertVisible: "Apri la pagina 2"
- tapOn: "Manda all'archivio «Fondo Prova»"
- assertVisible: "Mandare all'archivio «Fondo Prova»?"
- tapOn: "(?i)manda"
- extendedWaitUntil:
    visible: "Manda all'archivio «Fondo Prova»"
    timeout: 20000
- back
- assertVisible: "Ricevuta biblioteca \\(2\\), .*"
- tapOn: Documenti, cambia archivio
- tapOn: Fondo Prova
- extendedWaitUntil:
    visible: Da inviare · 2 pagine
    timeout: 20000
