appId: com.antonioorf.archiview.scanner
name: Documenti - scansione di un documento nuovo in una cartella, pagine aggiunte, Rifai
---
- launchApp
- extendedWaitUntil:
    visible: ArchiScanner
    timeout: 180000
- tapOn: Documenti, Ricevute, articoli, fotocopie
- tapOn: Ricevute
- tapOn: Scansiona un documento in Ricevute
- runFlow: ../comuni/scatta.yaml
- extendedWaitUntil:
    visible: Apri la pagina 1
    timeout: 20000
- assertVisible: "Documento .*"
- assertVisible: "Ricevute · 1 pagina · .*"
- tapOn: "Aggiungi pagine a Documento .*"
- runFlow: ../comuni/scatta.yaml
- extendedWaitUntil:
    visible: Apri la pagina 2
    timeout: 20000
- tapOn: Apri la pagina 2
- tapOn: Rifai
- runFlow: ../comuni/scatta.yaml
- extendedWaitUntil:
    visible: "Pagina 2 di 2.*"
    timeout: 20000
- tapOn: Chiudi
- tapOn: Documenti
- assertVisible: Documenti · 2 documenti
- tapOn: Scansiona un documento in Ricevute
- runFlow: ../comuni/annulla-scanner.yaml
- assertVisible: Documenti · 2 documenti
