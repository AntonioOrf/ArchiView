appId: com.antonioorf.archiview.scanner
name: Impostazioni - invio, dopo l'invio, copia dei Documenti, abbinamento Wi-Fi
---
- launchApp
- extendedWaitUntil:
    visible: Fondo Prova, cambia archivio
    timeout: 180000
- tapOn: Impostazioni
- assertVisible: Account Google
- assertVisible: Accedi con Google
- assertNotVisible: Invio automatico solo col Wi-Fi
- assertVisible:
    text: Conserva sempre
    checked: true
- tapOn: Cancella subito
- assertVisible:
    text: Cancella subito
    checked: true
- tapOn: Giorni
- eraseText: 3
- inputText: "3"
- pressKey: Enter
- assertVisible:
    text: Conserva per 3 giorni
    checked: true
- scrollUntilVisible:
    element: "I Documenti stanno solo su questo telefono. Accedi con Google.*"
- assertVisible:
    text: Copia dei Documenti su Drive
    enabled: false
- assertNotVisible: Ripristina da Drive
- stopApp
- launchApp:
    permissions:
      camera: deny
- extendedWaitUntil:
    visible: Fondo Prova, cambia archivio
    timeout: 30000
- tapOn: Impostazioni
- assertVisible:
    text: Conserva per 3 giorni
    checked: true
- scrollUntilVisible:
    element: Abbina col computer
- tapOn: Abbina col computer
- assertVisible: "L'abbinamento usa la fotocamera.*"
- tapOn: "Consenti.*"
- runFlow:
    when:
      visible: "(?i)(while using the app|mentre usi l'app|solo questa volta|only this time)"
    commands:
      - tapOn: "(?i)(while using the app|mentre usi l'app)"
- extendedWaitUntil:
    visible: Inquadra il codice QR sul computer.
    timeout: 15000
- tapOn: "(?i)annulla"
- scrollUntilVisible:
    element: Abbina col computer
- tapOn: Indietro
- assertVisible: Fondo Prova, cambia archivio
