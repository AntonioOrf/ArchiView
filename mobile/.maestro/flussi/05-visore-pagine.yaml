appId: com.antonioorf.archiview.scanner
name: Scheda e visore - etichetta, ruota, ritaglia, dividi, elimina
---
- launchApp
- extendedWaitUntil:
    visible: Fondo Prova, cambia archivio
    timeout: 180000
- tapOn: "Cartella Notarile.*"
- tapOn: Reg. 41, Imbreviature, 3 pagine da inviare
- assertVisible: Da inviare · 3 pagine
- assertVisible: Fondo Prova
- tapOn: Numera le carte
- tapOn: Prima carta
- eraseText: 5
- inputText: 5r
- hideKeyboard
- tapOn: Apri 1r
- assertVisible: "Pagina 1 di 3 · striscia per le altre"
- tapOn: Etichetta di 1r
- eraseText: 5
- inputText: 3r
- hideKeyboard
- assertVisible: Etichetta di 3r
- swipe:
    direction: LEFT
- assertVisible: "Pagina 2 di 3 · striscia per le altre"
- tapOn: Ruota
- extendedWaitUntil:
    visible:
      text: Ruota
      enabled: true
    timeout: 15000
- tapOn: Rifai
- runFlow: ../comuni/scatta.yaml
- extendedWaitUntil:
    visible: "Pagina 2 di 3 · striscia per le altre"
    timeout: 15000
- assertVisible: Etichetta di 1v
- tapOn: Ritaglia
- assertVisible: Ritaglia 1v
- assertVisible: Trascina gli angoli
- swipe:
    from: Angolo in alto a sinistra
    direction: DOWN
- tapOn: Pagina intera
- swipe:
    from: Angolo in basso a destra
    direction: UP
- tapOn:
    text: Ritaglia
    enabled: true
- extendedWaitUntil:
    visible: "Pagina 2 di 3 · striscia per le altre"
    timeout: 15000
- tapOn: Dividi
- assertVisible: Dividi la pagina doppia
- assertVisible: "Linea della piega, 50% da sinistra"
- tapOn: "Dividi in due.*"
- extendedWaitUntil:
    visible: "Pagina 2 di 4 · striscia per le altre"
    timeout: 15000
- assertVisible:
    text: Dividi
    enabled: false
- tapOn: Elimina
- assertVisible: Eliminare la pagina?
- tapOn: "(?i)annulla"
- assertVisible: "Pagina 2 di 4 · striscia per le altre"
- tapOn: Elimina
- tapOn: "(?i)elimina"
- extendedWaitUntil:
    visible: "Pagina . di 3 · striscia per le altre"
    timeout: 10000
- tapOn: Chiudi
- assertVisible: Da inviare · 3 pagine
- assertVisible: 3r
- assertVisible: dx
- back
- assertVisible: Invii · 2 lotti
