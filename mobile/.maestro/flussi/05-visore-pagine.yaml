appId: com.antonioorf.archiview.scanner
# seme: archivio
name: Scheda e visore - etichetta, ruota, ritaglia, dividi, elimina
---
- launchApp
- extendedWaitUntil:
    visible: Fondo Prova, cambia archivio
    timeout: 180000
- tapOn: "Cartella Notarile.*"
- tapOn: Reg. 41, Imbreviature, 3 pagine da inviare
- assertVisible: Da inviare · 3 pagine
- assertVisible: Fondo Prova
# Numerazione automatica: la prima carta si scrive solo con l'interruttore acceso.
- tapOn: Numera le carte
- tapOn: Prima carta
- eraseText: 5
- inputText: 5r
- hideKeyboard
- tapOn: Apri 1r
- assertVisible: "Pagina 1 di 3 · striscia per le altre"
# Etichetta della carta.
- tapOn: Etichetta di 1r
- eraseText: 5
- inputText: 3r
- hideKeyboard
- assertVisible: Etichetta di 3r
# Strisciata alla pagina dopo.
- swipe:
    direction: LEFT
- assertVisible: "Pagina 2 di 3 · striscia per le altre"
- tapOn: Ruota
- extendedWaitUntil:
    visible:
      text: Ruota
      enabled: true
    timeout: 15000
# Rifai: una pagina nuova al posto di questa, stessa etichetta.
- tapOn: Rifai
- runFlow: ../comuni/scatta.yaml
- extendedWaitUntil:
    visible: "Pagina 2 di 3 · striscia per le altre"
    timeout: 15000
- assertVisible: Etichetta di 1v
# Ritaglia: «Ritaglia» resta spento finché il riquadro è la pagina intera.
- tapOn: Ritaglia
- assertVisible: Ritaglia 1v
- assertVisible: Trascina gli angoli
- swipe:
    from: Angolo in alto a sinistra
    direction: DOWN
- tapOn: Pagina intera
- swipe:
    from: Angolo in basso a destra
    direction: UP
- tapOn:
    text: Ritaglia
    enabled: true
- extendedWaitUntil:
    visible: "Pagina 2 di 3 · striscia per le altre"
    timeout: 15000
# Dividi: una pagina doppia diventa due (sx e dx), poi «Dividi» si spegne.
- tapOn: Dividi
- assertVisible: Dividi la pagina doppia
- assertVisible: "Linea della piega, 50% da sinistra"
- tapOn: "Dividi in due.*"
- extendedWaitUntil:
    visible: "Pagina 2 di 4 · striscia per le altre"
    timeout: 15000
- assertVisible:
    text: Dividi
    enabled: false
# Elimina: prima annullato, poi confermato.
- tapOn: Elimina
- assertVisible: Eliminare la pagina?
- tapOn: "(?i)annulla"
- assertVisible: "Pagina 2 di 4 · striscia per le altre"
- tapOn: Elimina
- tapOn: "(?i)elimina"
- extendedWaitUntil:
    visible: "Pagina . di 3 · striscia per le altre"
    timeout: 10000
- tapOn: Chiudi
- assertVisible: Da inviare · 3 pagine
- assertVisible: 3r
# Eliminata la metà sinistra: resta la destra.
- assertVisible: dx
- back
- assertVisible: Da inviare · 4 pagine
