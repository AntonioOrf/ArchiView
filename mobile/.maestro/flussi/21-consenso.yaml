appId: com.antonioorf.archiview.scanner
# seme: senzaConsenso
name: Consenso - richiesto prima dello scanner, «Non ora» non apre nulla, revoca da Impostazioni
---
- launchApp
- extendedWaitUntil:
    visible: ArchiScanner
    timeout: 180000
- tapOn: Documenti, Ricevute, articoli, fotocopie
# Senza consenso: avviso, e con «Non ora» lo scanner non parte.
- tapOn: Scansiona un documento
- assertVisible: Fotocamera, foto e file
- tapOn: Non ora
- assertNotVisible:
    id: ".*optional_mlkit_docscan_ui.*"
- assertVisible: "Ricevuta biblioteca.*"
# Consenti: lo scanner parte (e si chiude senza salvare).
- tapOn: Scansiona un documento
- tapOn: Consenti
- runFlow: ../comuni/annulla-scanner.yaml
# Dato una volta, non si richiede.
- tapOn: Scansiona un documento
- assertNotVisible: Fotocamera, foto e file
- runFlow: ../comuni/annulla-scanner.yaml
# Revoca da Impostazioni: al prossimo uso si richiede.
- tapOn: Impostazioni
- assertVisible:
    text: Consenso a fotocamera, foto e file
    checked: true
- tapOn: Consenso a fotocamera, foto e file
- assertVisible:
    text: Consenso a fotocamera, foto e file
    checked: false
- tapOn: Indietro
- tapOn: Scansiona un documento
- assertVisible: Fotocamera, foto e file
- tapOn: Non ora
