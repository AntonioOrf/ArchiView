appId: com.antonioorf.archiview.scanner
name: F3 e F8 - pagina segnata sfocata, nota della carta che resta
---
- launchApp
- extendedWaitUntil:
    visible: Fondo Prova, cambia archivio
    timeout: 180000
- tapOn: "Cartella Notarile.*"
- tapOn: "Reg. 41, Imbreviature.*"
- assertVisible: "Sfocata?"
- assertVisible: "Apri 1v, forse sfocata"
- assertNotVisible: "Apri 1r, forse sfocata"
- tapOn: "Apri 1v, forse sfocata"
- assertVisible: "Sembra mossa o sfocata.*"
- swipe:
    direction: RIGHT
- assertVisible: "Pagina 1 di 3 · striscia per le altre"
- assertNotVisible: "Sembra mossa o sfocata.*"
- tapOn: Nota di 1r
- inputText: rifilata
- hideKeyboard
- tapOn: Chiudi
- tapOn: Apri 1r
- assertVisible: rifilata
