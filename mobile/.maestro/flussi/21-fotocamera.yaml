appId: com.antonioorf.archiview.scanner
name: Fotocamera - Android la chiede prima dello scanner, negata non scansiona, stato in Impostazioni
---
- launchApp:
    permissions:
      camera: deny
- extendedWaitUntil:
    visible: ArchiScanner
    timeout: 180000
- tapOn: Documenti, Ricevute, articoli, fotocopie
- tapOn: Scansiona un documento
- extendedWaitUntil:
    visible: "(?i)(don.t allow|non consentire)"
    timeout: 10000
- tapOn: "(?i)(don.t allow|non consentire)"
- assertVisible: Fotocamera non consentita
- tapOn: Non ora
- assertNotVisible:
    id: ".*optional_mlkit_docscan_ui.*"
- assertVisible: "Ricevuta biblioteca.*"
- tapOn: Impostazioni
- scrollUntilVisible:
    element: Gestisci nelle impostazioni di Android
- assertVisible: Fotocamera non consentita
- tapOn: Indietro
- tapOn: Scansiona un documento
- extendedWaitUntil:
    visible: "(?i)(while using the app|mentre usi l'app)"
    timeout: 10000
- tapOn: "(?i)(while using the app|mentre usi l'app)"
- runFlow: ../comuni/annulla-scanner.yaml
- tapOn: Scansiona un documento
- assertNotVisible: Fotocamera non consentita
- runFlow: ../comuni/annulla-scanner.yaml
- tapOn: Impostazioni
- scrollUntilVisible:
    element: Gestisci nelle impostazioni di Android
- assertVisible: Fotocamera consentita
