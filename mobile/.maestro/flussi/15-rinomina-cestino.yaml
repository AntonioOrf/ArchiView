appId: com.antonioorf.archiview.scanner
# seme: nuove
name: Scheda nata qui - rinomina con pagine in attesa, cestino con conferma (M10.8)
---
- launchApp
- extendedWaitUntil:
    visible: Fondo Prova, cambia archivio
    timeout: 180000
- tapOn: "Cartella Notarile.*"
- tapOn: "Busta 3, Creata qui.*"
- assertVisible: Da inviare · 2 pagine
# Rinomina: la segnatura nuova vale anche per le pagine già in attesa.
- tapOn: Rinomina la scheda
- eraseText: 20
- inputText: Busta 3 bis
- tapOn:
    text: Rinomina
    enabled: true
- assertVisible: Busta 3 bis
- back
- assertVisible: "Busta 3 bis, Creata qui.*"
- tapOn: "Da inviare, 6 pagine.*"
- assertVisible: "Busta 3 bis · 2.*"
- tapOn: "Da inviare, 6 pagine.*"
# Cestino: chiede conferma dicendo quante pagine si perdono; Annulla non toglie nulla.
- tapOn: "Busta 3 bis, Creata qui.*"
- tapOn: Elimina la scheda
- assertVisible: Eliminare «Busta 3 bis»?
- assertVisible: Le 2 pagine non inviate si perdono.
- tapOn: "(?i)annulla"
- assertVisible: Da inviare · 2 pagine
- tapOn: Elimina la scheda
- tapOn: "(?i)elimina"
- extendedWaitUntil:
    visible: Fondo Prova, cambia archivio
    timeout: 10000
- assertNotVisible: "Busta 3 bis.*"
- assertVisible: Da inviare · 4 pagine
