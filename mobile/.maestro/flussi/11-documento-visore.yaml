appId: com.antonioorf.archiview.scanner
name: Documento - visore con filtri, ruota, ritaglia, elimina pagina; Condividi o salva
---
- launchApp
- extendedWaitUntil:
    visible: ArchiScanner
    timeout: 180000
- tapOn: Documenti, Ricevute, articoli, fotocopie
- tapOn: "Ricevuta biblioteca, .*"
- tapOn: Apri la pagina 1
- assertVisible: "Pagina 1 di 2 · striscia per le altre"
- tapOn: Filtri
- assertVisible: Originale
- tapOn: Grigi
- extendedWaitUntil:
    visible:
      text: Grigi
      checked: true
    timeout: 20000
- tapOn: Usa per tutte
- extendedWaitUntil:
    visible:
      text: Usa per tutte
      enabled: true
    timeout: 30000
- tapOn: Filtri
- tapOn: Ruota
- extendedWaitUntil:
    visible:
      text: Ruota
      enabled: true
    timeout: 20000
- tapOn: Ritaglia
- assertVisible: Ritaglia la pagina
- swipe:
    from: Angolo in alto a sinistra
    direction: DOWN
- tapOn:
    text: Ritaglia
    enabled: true
- extendedWaitUntil:
    visible: "Pagina 1 di 2 · striscia per le altre"
    timeout: 20000
- tapOn: Elimina
- assertVisible: Eliminare la pagina?
- tapOn: "(?i)elimina"
- extendedWaitUntil:
    visible: Pagina 1 di 1
    timeout: 10000
- tapOn: Chiudi
- assertVisible: "Apri la pagina 1, filtro Grigi"
- assertNotVisible: "Apri la pagina 2.*"
- tapOn: Condividi o salva
- assertVisible: "PDF, Un file con tutte le pagine"
- tapOn: "Immagini JPEG, Un'immagine"
- assertVisible:
    text: "Immagini JPEG, Un'immagine"
    checked: true
- tapOn: Condividi…
- extendedWaitUntil:
    notVisible: Condividi o salva
    timeout: 20000
- back
- assertVisible: Tessera|Ricevuta biblioteca
