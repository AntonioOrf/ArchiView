appId: com.antonioorf.archiview.scanner
name: Documento - testo riconosciuto, correzione che resta, ricerca nel testo
---
- launchApp
- extendedWaitUntil:
    visible: ArchiScanner
    timeout: 180000
- tapOn: Documenti, Ricevute, articoli, fotocopie
- tapOn: "Ricevuta biblioteca, .*"
- tapOn: Apri la pagina 1
- tapOn: Testo
- assertVisible: Testo della pagina 1
- extendedWaitUntil:
    notVisible: Riconosco il testo…
    timeout: 60000
- assertVisible: Le correzioni restano col documento.
- tapOn: Testo riconosciuto
- inputText: " zzprova "
- assertVisible:
    text: Copia testo
    enabled: true
- tapOn:
    text: Chiudi
    rightOf: Testo della pagina 1
- assertNotVisible: Testo della pagina 1
- tapOn: Chiudi
- tapOn: Documenti
- tapOn: Cerca nei documenti
- inputText: zzprova
- assertVisible: Trovati
- assertVisible: "Ricevuta biblioteca, .*"
- assertNotVisible: "Fotocopia articolo, .*"
