appId: com.antonioorf.archiview.scanner
# seme: recupero
name: Bozza illeggibile - recupero delle foto in «Senza scheda» (M10.11)
---
- launchApp
- extendedWaitUntil:
    visible: Fondo Prova, cambia archivio
    timeout: 180000
- assertVisible: 1 scansione da recuperare
# Prima del recupero le due foto non sono in coda.
- assertVisible: Da inviare · 4 pagine
- tapOn: Recupera
- extendedWaitUntil:
    visible: Da inviare · 6 pagine
    timeout: 15000
- assertNotVisible: "1 scansione da recuperare"
- tapOn: "Da inviare, 6 pagine.*"
# Le foto recuperate entrano nel gruppo «Senza scheda» (1 + 2).
- assertVisible: "Senza scheda · 3, Da smistare al computer"
