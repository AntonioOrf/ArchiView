appId: com.antonioorf.archiview.scanner
---
- extendedWaitUntil:
    visible:
      id: ".*optional_mlkit_docscan_ui.*"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: ".*save_document_button"
    timeout: 20000
    optional: true
- runFlow:
    when:
      notVisible:
        id: ".*save_document_button"
    commands:
      - runFlow:
          when:
            notVisible: "(?i)(done|fine|salva)"
          commands:
            - tapOn:
                id: ".*(shutter|capture).*"
            - extendedWaitUntil:
                visible:
                  id: ".*save_document_button"
                timeout: 20000
                optional: true
- runFlow:
    when:
      visible:
        id: ".*save_document_button"
    commands:
      - tapOn:
          id: ".*save_document_button"
- runFlow:
    when:
      visible: "(?i)(done|fine|salva)"
    commands:
      - tapOn: "(?i)(done|fine|salva)"
- extendedWaitUntil:
    notVisible:
      id: ".*optional_mlkit_docscan_ui.*"
    timeout: 20000
