appId: com.antonioorf.archiview.scanner
---
- extendedWaitUntil:
    visible:
      id: ".*optional_mlkit_docscan_ui.*"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: ".*discard_scan_button"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible:
        id: ".*discard_scan_button"
    commands:
      - tapOn:
          id: ".*discard_scan_button"
      - tapOn:
          id: "android:id/button1"
- runFlow:
    when:
      visible:
        id: ".*optional_mlkit_docscan_ui.*"
    commands:
      - back
- extendedWaitUntil:
    notVisible:
      id: ".*optional_mlkit_docscan_ui.*"
    timeout: 15000
