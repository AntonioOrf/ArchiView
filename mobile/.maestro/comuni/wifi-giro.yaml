appId: com.antonioorf.archiview.scanner
---
- launchApp
- extendedWaitUntil:
    visible: Fondo Prova, cambia archivio
    timeout: 180000
- assertVisible: Invii · 2 lotti
- tapOn: Impostazioni
- scrollUntilVisible:
    element: Abbina col computer
- tapOn: Abbina col computer
- runFlow:
    when:
      visible: "Consenti.*"
    commands:
      - tapOn: "Consenti.*"
- runFlow:
    when:
      visible: "(?i)(while using the app|mentre usi l'app)"
    commands:
      - tapOn: "(?i)(while using the app|mentre usi l'app)"
- scrollUntilVisible:
    element: "Collegato a «Fondo Prova».*"
    timeout: 60000
- tapOn: Indietro
- assertVisible: Invii · 2 lotti
- assertVisible: ".*Sul telefono · premi Invia ora"
- tapOn: Invia ora
- extendedWaitUntil:
    notVisible: ".*Sul telefono · premi Invia ora"
    timeout: 120000
- assertVisible: "Reg\\. 41, 3 pagine, Arrivato sul computer · oggi .*"
- tapOn: Fondo Prova, cambia archivio
- tapOn: Fondo Altro
- assertVisible: Invii · 1 lotto
- tapOn: Fondo Altro, cambia archivio
- tapOn: Fondo Prova
- extendedWaitUntil:
    visible: "Questo testo non compare mai"
    timeout: 25000
    optional: true
- tapOn: Scansiona o crea una scheda
- tapOn: Scannerizza senza scheda, da smistare al computer
- runFlow: scatta.yaml
- back
- assertVisible: "Senza scheda, 1 pagina, Sul telefono · premi Invia ora"
- tapOn: Invia ora
- extendedWaitUntil:
    visible: Computer scollegato
    timeout: 60000
- tapOn: OK
- assertVisible: "Senza scheda, 1 pagina, Sul telefono · premi Invia ora"
- assertVisible: "Senza scheda: Il computer non risponde.*"
